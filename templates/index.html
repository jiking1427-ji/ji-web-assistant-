<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ji Web Assistant</title>
    <meta name="google-site-verification" content="hs6SDrX6VaayqB-Jdtf75J4HI72qc47MrKViIulSX_M" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f0f2f5; }
        .sidebar { width: 260px; background-color: #1e1e2d; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #4e73df; }
        .new-chat-btn { background: #4e73df; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: white; padding: 15px 20px; border-bottom: 1px solid #ddd; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; white-space: pre-wrap; }
        .user-message { background: #4e73df; color: white; align-self: flex-end; }
        .bot-message { background: white; color: #333; align-self: flex-start; border: 1px solid #e3e6f0; }
        .input-area { background: white; padding: 15px 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        .input-area input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .input-area input[type="file"] { display: none; }
        .file-label { background: #eaecf4; padding: 10px; border-radius: 5px; cursor: pointer; }
        .send-btn { background: #1cc88a; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .send-btn:disabled { background: #858796; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Ji Web Assistant</h2>
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
    </div>

    <div class="main-content">
        <div class="chat-header">Ji Web Assistant Chat</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">வணக்கம்! நான் உங்களுக்கு எப்படி உதவட்டும்?</div>
        </div>
        
        <form class="input-area" id="chatForm">
            <label class="file-label" for="imageInput">📷</label>
            <input type="file" id="imageInput" accept="image/*">
            <input type="text" id="promptInput" placeholder="Ask your question here..." autocomplete="off">
            <button type="submit" class="send-btn" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        document.getElementById("chatForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            var promptInput = document.getElementById("promptInput");
            var imageInput = document.getElementById("imageInput");
            var chatBox = document.getElementById("chatBox");
            var sendBtn = document.getElementById("sendBtn");
            
            var prompt = promptInput.value.trim();
            var imageFile = imageInput.files[0];
            
            if (!prompt && !imageFile) return;
            
            var userText = prompt;
            if (imageFile) {
                userText = userText + " 🖼️ [" + imageFile.name + "]";
            }
            
            appendMessage(userText, "user-message");
            promptInput.value = "";
            imageInput.value = "";
            sendBtn.disabled = true;
            
            var botMsgDiv = appendMessage("சிந்தித்துக் கொண்டிருக்கிறேன்...", "bot-message");
            
            var formData = new FormData();
            formData.append("prompt", prompt);
            if (imageFile) {
                formData.append("image", imageFile);
            }
            
            try {
                var response = await fetch("/chat", {
                    method: "POST",
                    body: formData
                });
                var data = await response.json();
                botMsgDiv.textContent = data.response;
            } catch (error) {
                botMsgDiv.textContent = "பிழை ஏற்பட்டது! மீண்டும் முயற்சிக்கவும்.";
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        function appendMessage(text, className) {
            var chatBox = document.getElementById("chatBox");
            var msgDiv = document.createElement("div");
            msgDiv.className = "message " + className;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
